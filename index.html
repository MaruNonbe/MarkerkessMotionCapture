<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video to VRM Motion</title>
    <!-- @mediapipe/holistic は npm/ESM 形式で配布されていないため CDN から読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/holistic.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>Video → VRM Motion</h1>
        <p class="subtitle">動画に映る人物の動きを3Dキャラクター(VRM)にリアルタイム反映</p>
      </header>

      <main class="layout">
        <section class="stage">
          <div class="canvas-wrap">
            <canvas id="three-canvas"></canvas>
            <video id="input-video" playsinline style="display:none"></video>
          </div>
          <div class="preview-wrap">
            <canvas id="landmark-canvas"></canvas>
          </div>
        </section>

        <aside class="panel">
          <div class="field">
            <label>入力ソース</label>
            <div class="btn-row">
              <button id="btn-webcam" class="btn">Webカメラ</button>
              <label class="btn file-btn">
                動画ファイル
                <input id="input-file" type="file" accept="video/*" hidden />
              </label>
            </div>
          </div>

          <div class="field">
            <label>VRMモデル</label>
            <label class="btn file-btn full">
              .vrmファイルを読み込む
              <input id="input-vrm" type="file" accept=".vrm" hidden />
            </label>
            <p class="hint">未指定の場合はサンプルの棒人間アバターで動作確認できます。</p>
          </div>

          <div class="field">
            <label>動きの記録</label>
            <button id="btn-record" class="btn full">録画開始</button>
            <p class="hint">録画終了時に、動きをBVHファイルとしてダウンロードします(Blender等に取り込めます)。</p>
          </div>

          <div class="field">
            <label>再生コントロール</label>
            <div class="btn-row">
              <button id="btn-play" class="btn" disabled>再生</button>
              <button id="btn-pause" class="btn" disabled>一時停止</button>
            </div>
          </div>


          <div class="field status-field">
            <label>ステータス</label>
            <div id="status" class="status">待機中</div>
          </div>

          <div class="field">
            <label class="checkbox-label">
              <input id="toggle-landmarks" type="checkbox" checked />
              骨格プレビューを表示
            </label>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
